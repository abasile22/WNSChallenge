<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando - WNS Challenge</title>
    <link rel="stylesheet" href={{ url_for('static', filename='style.css') }}>
</head>
<body>
<div class="main-container">
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <h1>Procesando datos...</h1>
    <p id="loading-message">Por favor espera mientras cargamos tus datos</p>
  </div>
</div>
<script>
    let checkCount = 0;
    const maxChecks = 300;

    function checkIfReady() {
        fetch("/api/check-load-status")
            .then(res => res.json())
            .then(data => {
                if (data.ready) {
                    window.location.href = "/api/meals/search";
                } else {
                    checkCount++;
                    if (checkCount < maxChecks) {
                        setTimeout(checkIfReady, 1000);
                    } else {
                        document.getElementById("loading-message").textContent =
                            "La carga está tardando más de lo esperado. Redirigiendo...";
                        setTimeout(() => {
                            window.location.href = "/api/meals/search";
                        }, 3000);
                    }
                }
            })
            .catch(error => {
                console.error("Error checking status:", error);
                checkCount++;
                if (checkCount < maxChecks) {
                    setTimeout(checkIfReady, 1000);
                }
            });
    }

    checkIfReady();
</script>
</body>
</html>
